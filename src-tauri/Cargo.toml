[package]
name = "agenda"
version = "1.2.0"
description = "Agenda minimalista de recordatorios con fecha"
edition = "2021"

[lib]
name = "agenda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["net", "io-util", "time"] }
sha2 = "0.10"
base64 = "0.22"
url = "2"
getrandom = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Misma versión que usa wry: para cerrar los popups que piden `window.close()` y aceptar
# certificados de puertos mal configurados (ver `comprobante::reparar_tls`).
webkit2gtk = { version = "=2.0.2", features = ["v2_6"] }
pdf-extract = "0.12.1"
